<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ドット絵メーカー</title>
<meta name="description" content="写真やイラストを、ファミコン風・ゲームボーイ風などのドット絵に変換するブラウザアプリ。画像は端末の外へ送信されません。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* ドット絵メーカー */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }

/* Layout: プレビューを大きく左(スマホは上)、操作パネルを右(スマホは下)。出力画像が主役で、UIは静かに。 */
:root {
  --bg: #eeeef6;
  --panel: #fafaff;
  --fg: #1c1b2e;
  --muted: #62607c;
  --line: #d3d1e6;
  --accent: #5a49e8;
  --accent-fg: #ffffff;
  --frame: #1a1830;
  --font-display: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  color-scheme: light;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121120; --panel: #1b1a2e; --fg: #ecebf8; --muted: #9b99b8;
    --line: #333152; --accent: #a398ff; --accent-fg: #14122a; --frame: #0b0a16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121120; --panel: #1b1a2e; --fg: #ecebf8; --muted: #9b99b8;
  --line: #333152; --accent: #a398ff; --accent-fg: #14122a; --frame: #0b0a16;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-inline: 16px; padding-block: 0 40px;
}
.wrap { max-width: 1040px; margin-inline: auto; display: grid; gap: 4px; }
header { display: flex; flex-direction: column; gap: 2px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 17px; letter-spacing: .06em; margin: 0; line-height: 1.3; }
header p { display: none; }
.layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 840px) {
  .layout { grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); }
}
.stage {
  display: grid; gap: 8px; min-width: 0;
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 8px;
}
.frame {
  background: var(--frame); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px; display: grid; place-items: center; position: relative;
}
.frame.drag { outline: 2px dashed var(--accent); outline-offset: -6px; }
#view { display: block; width: auto; max-width: 100%; max-height: 36vh; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; background: conic-gradient(#3a3852 25%, #2c2a42 0 50%, #3a3852 0 75%, #2c2a42 0) 0 0 / 16px 16px; }
#view.smooth { image-rendering: auto; }
.statusbar { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; }
.statusbar b { font-family: var(--font-display); font-weight: 400; color: var(--fg); letter-spacing: .03em; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.head .segs { width: 168px; flex: none; }
.head .seg { min-height: 36px; padding: 4px 6px; }
.chip { position: absolute; left: 12px; bottom: 12px; background: rgba(0,0,0,.62); color: #fff; font-family: var(--font-display); font-size: 12px; letter-spacing: .03em; padding: 1px 8px; border-radius: 3px; pointer-events: none; font-variant-numeric: tabular-nums; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.bar .statusbar { display: grid; gap: 0; justify-content: start; min-width: 0; line-height: 1.4; }
.bar .segs { width: 168px; flex: none; }
.bar .seg { min-height: 36px; padding: 4px 6px; }
.tune { display: grid; gap: 2px; }
.tune .field { gap: 0; }
.tune input[type="range"] { min-height: 26px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; gap: 20px; min-width: 0; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 8px; }
legend, .lbl { font-family: var(--font-display); font-size: 14px; letter-spacing: .06em; padding: 0; margin-bottom: 8px; color: var(--fg); }
.btn {
  appearance: none; font: inherit; font-weight: 700; cursor: pointer;
  background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 4px;
  padding: 10px 16px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn:hover { filter: brightness(1.06); }
.btn:focus-visible, input:focus-visible + .card, input:focus-visible + .seg { outline: 2px solid var(--accent); outline-offset: 2px; }
.pals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pal input, .segs input { position: absolute; opacity: 0; pointer-events: none; }
.pal { position: relative; display: block; }
.card {
  display: grid; gap: 6px; border: 1px solid var(--line); border-radius: 4px; padding: 8px;
  cursor: pointer; background: var(--bg); height: 100%;
}
.card .name { font-weight: 700; font-size: 13px; line-height: 1.3; }
.card .sub { font-size: 12px; color: var(--muted); }
.strip { display: flex; height: 16px; border-radius: 2px; overflow: hidden; }
.strip i { flex: 1; display: block; }
.pal input:checked + .card { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0; position: relative; }
.seg {
  display: grid; place-items: center; text-align: center; padding: 8px 6px; min-height: 40px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); font-size: 14px;
}
.segs label:first-child .seg { border-radius: 4px 0 0 4px; }
.segs label:last-child .seg { border-radius: 0 4px 4px 0; }
.segs label:not(:first-child) .seg { border-left-width: 0; }
.segs label { position: relative; display: block; }
.segs input:checked + .seg { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.field { display: grid; gap: 4px; }
.field .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.field .top output { font-variant-numeric: tabular-nums; color: var(--muted); }
input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 28px; margin: 0; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
#toast { min-height: 20px; font-size: 13px; color: var(--muted); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (min-width: 840px) {
  .stage { top: 20px; }
  #view { max-height: 56vh; }
}
</style>
</head>
<body>
<div class="wrap">

  <div class="layout">
    <section class="stage" aria-label="プレビュー">
      <div class="head">
        <h1>ドット絵メーカー</h1>
        <div class="segs" role="radiogroup" aria-label="表示切り替え">
          <label><input type="radio" name="show" value="dot" checked><span class="seg">ドット絵</span></label>
          <label><input type="radio" name="show" value="orig"><span class="seg">元画像</span></label>
        </div>
      </div>
      <div class="frame" id="frame">
        <canvas id="view" width="960" height="430" aria-label="変換結果のプレビュー"></canvas>
        <div class="chip"><span id="info">-</span></div>
      </div>
      <div class="tune">
        <div class="field">
          <div class="top"><label for="grid">ドットの粗さ</label><output id="gridOut">横 96 ドット</output></div>
          <input type="range" id="grid" min="24" max="220" step="2" value="96">
        </div>
        <div class="field">
          <div class="top"><label for="bright">明るさ</label><output id="brightOut">0</output></div>
          <input type="range" id="bright" min="-50" max="50" step="1" value="0">
        </div>
        <div class="field">
          <div class="top"><label for="contrast">コントラスト</label><output id="contrastOut">0</output></div>
          <input type="range" id="contrast" min="-50" max="50" step="1" value="0">
        </div>
      </div>
    </section>

    <section class="panel" aria-label="設定">
      <div class="field">
        <span class="lbl">画像</span>
        <div class="row">
          <label class="btn" for="file">画像を選ぶ</label>
          <input class="visually-hidden" type="file" id="file" accept="image/*">
          <button class="btn ghost" type="button" id="sample">サンプルに戻す</button>
        </div>
        <p class="hint">読み込み中：<span id="srcname">サンプル画像</span></p>
        <p class="hint">プレビューへドラッグ＆ドロップでも読み込めます。画像は端末の外へ送信されません。</p>
      </div>

      <fieldset>
        <legend>パレット</legend>
        <div class="pals" id="pals"></div>
      </fieldset>

      <fieldset>
        <legend>ドットの形</legend>
        <div class="segs" role="radiogroup" aria-label="ドットの形">
          <label><input type="radio" name="shape" value="square" checked><span class="seg">四角</span></label>
          <label><input type="radio" name="shape" value="circle"><span class="seg">丸</span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>ディザ（網点）</legend>
        <div class="segs" role="radiogroup" aria-label="ディザ">
          <label><input type="radio" name="dither" value="off"><span class="seg">なし</span></label>
          <label><input type="radio" name="dither" value="bayer" checked><span class="seg">あり</span></label>
        </div>
      </fieldset>

      <div class="field">
        <button class="btn" type="button" id="save">PNGで保存</button>
        <p class="hint" id="saveHint">保存すると、拡大したPNG画像がダウンロードされます。</p>
        <div id="toast" role="status" aria-live="polite"></div>
      </div>
    </section>
  </div>
</div>

      "F0D0B0","F87858","F83800","A81000","FCE0A8","FCA044","E45C10","881400","F8D878","F8B800","AC7C00","503000",
      "D8F878","B8F818","58D854","00A800","007800","B8F8B8","58F898","00A844","00E8D8","008888","004058"
    ] },
    { id: "gb", name: "ゲームボーイ風", mono: true, colors: ["081820","346856","88C070","E0F8D0"] },
    { id: "pico", name: "PICO-8風", mono: false, colors: [
      "000000","1D2B53","7E2553","008751","AB5236","5F574F","C2C3C7","FFF1E8",
      "FF004D","FFA300","FFEC27","00E436","29ADFF","83769C","FF77A8","FFCCAA"
    ] },
    { id: "red", name: "赤と黒", mono: true, colors: ["000000","550000","AA0000","FF2020"] },
    { id: "sepia", name: "セピア", mono: true, colors: ["1E1208","5A3D24","9A7048","D4B07C","F4E4C4"] },
    { id: "neon", name: "ネオン", mono: false, colors: ["07030F","1B0F3D","5B2BD9","0A84FF","00F0FF","A8FFF4","FF2BD6","FF7AE0","FFE600","FFFFFF"] },
    { id: "green", name: "グリーンモニター", mono: true, colors: ["020A04","0B3D14","1F8F2E","4CFF6A","C8FFD2"] },
    { id: "yume", name: "ゆめかわパステル", mono: false, colors: [
      "2E2A4A","5B5F97","6D597A","8F94D6","CDB4DB","C7CEEA","A2D2FF","BDE0FE","B5EAD7","FFF1B8","FFDFBA","FFAFCC","FFC8DD","FFFFFF"
    ] }
  ];
  PALETTES.forEach(function (p) {
    p.rgb = p.colors.map(function (h) { return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; });
    if (p.mono) { p.lum = p.rgb.map(function (c) { return 0.299*c[0]+0.587*c[1]+0.114*c[2]; }); }
  });

  var BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];

  var $ = function (id) { return document.getElementById(id); };
  var view = $("view"), vctx = view.getContext("2d");
  var gridEl = $("grid"), brightEl = $("bright"), contrastEl = $("contrast");
  var infoEl = $("info"), srcnameEl = $("srcname"), toast = $("toast");
  var srcCanvas = document.createElement("canvas");
  var small = document.createElement("canvas"), sctx = small.getContext("2d");
  var dotBig = document.createElement("canvas"), dctx = dotBig.getContext("2d");
  var state = { pal: "nes", dither: "bayer", show: "dot", shape: "square", name: "sample" };
  var pending = false;

  /* パレット選択カードを組み立てる */
  var palsEl = $("pals");
  PALETTES.forEach(function (p, i) {
    var step = Math.max(1, Math.floor(p.colors.length / 14));
    var sw = "";
    for (var k = 0; k < p.colors.length; k += step) sw += '<i style="background:#' + p.colors[k] + '"></i>';
    var lab = document.createElement("label");
    lab.className = "pal";
    lab.innerHTML = '<input type="radio" name="pal" value="' + p.id + '"' + (i === 0 ? " checked" : "") + '>' +
      '<span class="card"><span class="strip">' + sw + '</span><span class="name">' + p.name +
      '</span><span class="sub">' + p.colors.length + '色</span></span>';
    palsEl.appendChild(lab);
  });

  function getPal() { return PALETTES.filter(function (p) { return p.id === state.pal; })[0]; }

  /* 段階的に半分へ縮小し、細部がギザつかないようにする */
  function downscale(from, W, H) {
    var cur = from, cw = from.width, ch = from.height;
    while (cw / 2 > W && ch / 2 > H) {
      var nw = Math.ceil(cw / 2), nh = Math.ceil(ch / 2);
      var t = document.createElement("canvas"); t.width = nw; t.height = nh;
      var c = t.getContext("2d"); c.imageSmoothingEnabled = true; c.imageSmoothingQuality = "high";
      c.drawImage(cur, 0, 0, nw, nh); cur = t; cw = nw; ch = nh;
    }
    small.width = W; small.height = H;
    sctx.imageSmoothingEnabled = true; sctx.imageSmoothingQuality = "high";
    sctx.clearRect(0, 0, W, H);
    sctx.drawImage(cur, 0, 0, W, H);
  }

  /* 丸ドット用：色ごとに1枚つくって使い回す */
  function sprite(r, g, b, s) {
    var c = document.createElement("canvas"); c.width = c.height = s;
    var x = c.getContext("2d");
    x.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
    x.beginPath(); x.arc(s / 2, s / 2, s * 0.47, 0, Math.PI * 2); x.fill();
    return c;
  }

  function drawCircles(d, W, H, s) {
    dctx.globalCompositeOperation = "source-over";
    dctx.fillStyle = "#fbfbfd";
    dctx.fillRect(0, 0, dotBig.width, dotBig.height);
    var cache = {}, x, y, i, key;
    for (y = 0; y < H; y++) {
      for (x = 0; x < W; x++) {
        i = (y * W + x) * 4;
        if (d[i + 3] < 128) continue;
        key = (d[i] << 16) | (d[i + 1] << 8) | d[i + 2];
        dctx.drawImage(cache[key] || (cache[key] = sprite(d[i], d[i + 1], d[i + 2], s)), x * s, y * s);
      }
    }
  }

  function convert() {
    pending = false;
    if (!srcCanvas.width) return;
    var W = +gridEl.value;
    var H = Math.max(1, Math.round(W * srcCanvas.height / srcCanvas.width));
    $("gridOut").textContent = "横 " + W + " ドット";
    $("brightOut").textContent = brightEl.value;
    $("contrastOut").textContent = contrastEl.value;

    downscale(srcCanvas, W, H);
    var img = sctx.getImageData(0, 0, W, H), d = img.data;
    var pal = getPal(), n = pal.rgb.length;
    var bAdd = +brightEl.value * 2.55, cv = +contrastEl.value * 2.55;
    var f = (259 * (cv + 255)) / (255 * (259 - cv));
    var useDither = state.dither === "bayer";
    var spread = pal.mono ? 240 / (n - 1) : 127.5 / Math.cbrt(n);
    var used = {};

    for (var y = 0; y < H; y++) {
      for (var x = 0; x < W; x++) {
        var i = (y * W + x) * 4;
        var a = d[i + 3];
        var r = (d[i]   - 128) * f + 128 + bAdd;
        var g = (d[i+1] - 128) * f + 128 + bAdd;
        var b = (d[i+2] - 128) * f + 128 + bAdd;
        var off = useDither ? (BAYER[(y & 3) * 4 + (x & 3)] / 16 - 0.5) * spread : 0;
        var idx;
        if (pal.mono) {
          var l = 0.299 * r + 0.587 * g + 0.114 * b + off;
          idx = Math.floor(l / 256 * n);
          idx = idx < 0 ? 0 : idx > n - 1 ? n - 1 : idx;
        } else {
          r += off; g += off; b += off;
          var best = 1e12; idx = 0;
          for (var k = 0; k < n; k++) {
            var c = pal.rgb[k];
            var dr = r - c[0], dg = g - c[1], db = b - c[2];
            var dist = 2 * dr * dr + 4 * dg * dg + 3 * db * db;
            if (dist < best) { best = dist; idx = k; }
          }
        }
        var col = pal.rgb[idx];
        d[i] = col[0]; d[i+1] = col[1]; d[i+2] = col[2]; d[i+3] = a < 128 ? 0 : 255;
        used[idx] = 1;
      }
    }
    sctx.putImageData(img, 0, 0);

    var sh = state.shape;
    var s = Math.max(sh === "square" ? 1 : 8, Math.ceil(1200 / W));
    dotBig.width = W * s; dotBig.height = H * s;
    if (sh === "square") {
      dctx.imageSmoothingEnabled = false;
      dctx.clearRect(0, 0, dotBig.width, dotBig.height);
      dctx.drawImage(small, 0, 0, W * s, H * s);
    } else {
      drawCircles(d, W, H, s);
    }

    infoEl.textContent = W + " × " + H + " ドット ／ " + Object.keys(used).length + "色使用";
    paint();
  }

  function paint() {
    var w = dotBig.width, h = dotBig.height;
    if (!w) return;
    view.width = w; view.height = h;
    if (state.show === "dot") {
      view.classList.toggle("smooth", state.shape !== "square");
      vctx.imageSmoothingEnabled = false;
      vctx.drawImage(dotBig, 0, 0);
    } else {
      view.classList.add("smooth");
      vctx.imageSmoothingEnabled = true; vctx.imageSmoothingQuality = "high";
      vctx.drawImage(srcCanvas, 0, 0, w, h);
    }
  }

  function schedule() { if (!pending) { pending = true; requestAnimationFrame(convert); } }

  function setSource(imgEl, name) {
    var max = 1000;
    var sw = imgEl.naturalWidth || imgEl.width, sh = imgEl.naturalHeight || imgEl.height;
    var k = Math.min(1, max / Math.max(sw, sh));
    srcCanvas.width = Math.max(1, Math.round(sw * k));
    srcCanvas.height = Math.max(1, Math.round(sh * k));
    var c = srcCanvas.getContext("2d");
    c.imageSmoothingEnabled = true; c.imageSmoothingQuality = "high";
    c.clearRect(0, 0, srcCanvas.width, srcCanvas.height);
    c.drawImage(imgEl, 0, 0, srcCanvas.width, srcCanvas.height);
    state.name = name;
    srcnameEl.textContent = name === "sample" ? "サンプル画像" : name;
    schedule();
  }

  function loadSample() {
    var im = new Image();
    im.onload = function () { setSource(im, "sample"); };
    im.src = SAMPLE;
  }

  function loadFile(file) {
    if (!file || !/^image\//.test(file.type)) { toast.textContent = "画像ファイルを選んでください。"; return; }
    var url = URL.createObjectURL(file);
    var im = new Image();
    im.onload = function () {
      setSource(im, file.name.length > 28 ? file.name.slice(0, 26) + "…" : file.name);
      URL.revokeObjectURL(url);
      toast.textContent = "";
    };
    im.onerror = function () { URL.revokeObjectURL(url); toast.textContent = "この画像は読み込めませんでした。JPEG・PNGなどで試してください。"; };
    im.src = url;
  }

  /* イベント */
  $("file").addEventListener("change", function (e) { loadFile(e.target.files[0]); e.target.value = ""; });
  $("sample").addEventListener("click", loadSample);
  [gridEl, brightEl, contrastEl].forEach(function (el) { el.addEventListener("input", schedule); });
  document.querySelectorAll('input[name="pal"]').forEach(function (el) {
    el.addEventListener("change", function () { state.pal = el.value; schedule(); });
  });
  document.querySelectorAll('input[name="dither"]').forEach(function (el) {
    el.addEventListener("change", function () { state.dither = el.value; schedule(); });
  });
  document.querySelectorAll('input[name="shape"]').forEach(function (el) {
    el.addEventListener("change", function () { state.shape = el.value; schedule(); });
  });
  document.querySelectorAll('input[name="show"]').forEach(function (el) {
    el.addEventListener("change", function () { state.show = el.value; paint(); });
  });

  var frame = $("frame");
  ["dragenter", "dragover"].forEach(function (t) {
    frame.addEventListener(t, function (e) { e.preventDefault(); frame.classList.add("drag"); });
  });
  ["dragleave", "drop"].forEach(function (t) {
    frame.addEventListener(t, function (e) { e.preventDefault(); frame.classList.remove("drag"); });
  });
  frame.addEventListener("drop", function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFile(f);
  });

  /* 保存：変換結果をPNGとしてダウンロードする */
  $("save").addEventListener("click", function () {
    if (!dotBig.width) return;
    dotBig.toBlob(function (blob) {
      if (!blob) { toast.textContent = "画像を書き出せませんでした。"; return; }
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "dot-" + state.pal + ".png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      toast.textContent = "保存しました。";
    }, "image/png");
  });

  loadSample();
})();
</script>
</body>
</html>
